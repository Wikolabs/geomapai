version: "3.9"

# geomapai demo - production-ready POC.
# 2 services orchestrated:
#   - geomapai (Next.js frontend on host port 3023)
#   - geomapai-backend (FastAPI Python, internal only on 8000)
# Shared external network wkdemo-net (created once by deploy.yml) avoids
# Docker default address-pool exhaustion across all 47 LP stacks.

services:
  geomapai-backend:
    image: ghcr.io/wikolabs/geomapai-backend:latest
    container_name: geomapai-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - wkdemo_net

  geomapai:
    image: ghcr.io/wikolabs/geomapai:latest
    container_name: geomapai
    restart: unless-stopped
    ports:
      - "3023:3000"
    environment:
      BACKEND_URL: "http://geomapai-backend:8000"
    depends_on:
      - geomapai-backend
    networks:
      - wkdemo_net

networks:
  wkdemo_net:
    name: wkdemo-net
    external: true
