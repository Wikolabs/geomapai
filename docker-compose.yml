version: "3.9"

# GeoMapAI demo — production-ready POC.
# 2 services orchestrated:
#   - geomapai (Next.js frontend on host port 3023)
#   - geomapai-backend (FastAPI Python, internal only on 8000)
# Internal network so the frontend can reach the backend by service name.

services:
  geomapai-backend:
    image: ghcr.io/wikolabs/geomapai-backend:latest
    container_name: geomapai-backend
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - geomapai-net

  geomapai:
    image: ghcr.io/wikolabs/geomapai:latest
    container_name: geomapai
    restart: unless-stopped
    ports:
      - "3023:3000"
    environment:
      BACKEND_URL: "http://geomapai-backend:8000"
    depends_on:
      - geomapai-backend
    networks:
      - geomapai-net

networks:
  geomapai-net:
    name: geomapai-net
    driver: bridge
